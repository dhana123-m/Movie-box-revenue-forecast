# Render blueprint -- https://render.com/docs/blueprint-spec
#
# Deploys two separate services:
#   1. movie-box-office-backend   -- FastAPI + TensorFlow web service
#   2. movie-box-office-frontend  -- React static site that calls the API
#
# To deploy:
#   1. Push this repository to GitHub (private or public).
#   2. On https://render.com go to Dashboard -> New -> Blueprint, pick the repo.
#   3. Render creates the backend web service and the frontend static site,
#      then wires them together via VITE_API_BASE_URL / CORS_ORIGINS below.
#
# Notes:
#   * The trained model + preprocessor are committed to git, so the backend
#     does not re-train -- it loads the artifacts on boot and seeds the SQLite
#     database from backend/data/processed/tmdb_5000_processed.csv.
#   * SQLite lives on Render's ephemeral disk: predictions persist for the
#     life of the service instance and reset on redeploy (fine for a demo).
#   * Retraining is disabled in production (ALLOW_RETRAIN=false).

services:
  # ------------------------------------------------------------ backend ----
  - type: web
    name: movie-box-office-backend
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_RETRAIN
        value: "false"
      - key: CORS_ORIGINS
        value: https://movie-box-office-frontend.onrender.com
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: INR_PER_USD
        value: "83.0"

  # ----------------------------------------------------------- frontend ----
  - type: web
    name: movie-box-office-frontend
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://movie-box-office-backend.onrender.com/api
